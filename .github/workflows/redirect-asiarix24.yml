name: Deploy Redirect - asiarix24 to spheretap.com

on:
  workflow_dispatch:

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm i -g wrangler@3.90.0

      - name: Create redirect files
        run: |
          mkdir redirect-site
          echo '/* https://spheretap.com/:splat 301' > redirect-site/_redirects

      - name: Create CF Pages project (skip if exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create asiarix24 --production-branch main || echo "Project may already exist, continuing..."

      - name: Deploy redirect to Cloudflare Pages (asiarix24)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy redirect-site --project-name asiarix24 --branch main --commit-dirty=true