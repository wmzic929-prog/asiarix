name: Cleanup - Delete asiarix24 Pages project

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete asiarix24 CF Pages project
        run: |
          RESPONSE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/asiarix24")
          echo "HTTP $RESPONSE"
          cat /tmp/resp.json
          [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "204" ] || exit 1